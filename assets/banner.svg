<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f15"/>
      <stop offset="0.55" stop-color="#121a24"/>
      <stop offset="1" stop-color="#0d1b22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d68a"/>
      <stop offset="0.5" stop-color="#c8a14b"/>
      <stop offset="1" stop-color="#8a6a2b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe3ee"/>
      <stop offset="1" stop-color="#2f8f99"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#4fb3bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4fb3bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hex" width="56" height="48.5" patternUnits="userSpaceOnUse" patternTransform="scale(1.1)">
      <path d="M14 0h28l14 24.25-14 24.25H14L0 24.25z" fill="none" stroke="#c8a14b" stroke-opacity="0.07" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#hex)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- 徽标：三层六边形 -->
  <g transform="translate(250 160)">
    <path d="M0-118 102-59v118L0 118-102 59v-118z" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <path d="M0-92 80-46v92L0 92-80 46v-92z" fill="#0e1116" stroke="#c8a14b" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M0-58 50-29v58L0 58-50 29v-58z" fill="url(#teal)"/>
    <path d="M0-58 50-29 0 0-50-29z" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="0" cy="0" r="10" fill="#0e1116"/>
  </g>

  <!-- 标题 -->
  <text x="420" y="138" font-family="'Microsoft YaHei UI','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="72" font-weight="700" fill="url(#gold)" letter-spacing="6">海克斯领航</text>
  <text x="424" y="190" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="600" fill="#e6e1d3" letter-spacing="1">HexPilot · ARAM Mayhem Companion</text>
  <text x="424" y="230" font-family="'Microsoft YaHei UI','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" fill="#8b949e">海克斯大乱斗助手 · 选人推荐 · 出装导入 · 强化识别</text>

  <!-- 标签 -->
  <g font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="16" font-weight="600">
    <rect x="424" y="252" width="118" height="32" rx="16" fill="none" stroke="#c8a14b" stroke-opacity="0.6"/>
    <text x="483" y="273" text-anchor="middle" fill="#c8a14b">Tier · S/A/B</text>
    <rect x="554" y="252" width="96" height="32" rx="16" fill="none" stroke="#4fb3bf" stroke-opacity="0.6"/>
    <text x="602" y="273" text-anchor="middle" fill="#4fb3bf">OCR</text>
    <rect x="662" y="252" width="112" height="32" rx="16" fill="none" stroke="#4fb3bf" stroke-opacity="0.6"/>
    <text x="718" y="273" text-anchor="middle" fill="#4fb3bf">Overlay</text>
    <rect x="786" y="252" width="152" height="32" rx="16" fill="none" stroke="#8b949e" stroke-opacity="0.6"/>
    <text x="862" y="273" text-anchor="middle" fill="#c9d1d9">No memory read</text>
  </g>

  <!-- 右侧装饰：强化卡片剪影 -->
  <g transform="translate(1010 60)" opacity="0.9">
    <rect x="0" y="22" width="70" height="104" rx="8" fill="#161b22" stroke="#8b949e" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="84" y="0" width="76" height="126" rx="8" fill="#161b22" stroke="url(#gold)" stroke-width="3"/>
    <rect x="174" y="22" width="70" height="104" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="102" y="96" width="40" height="20" rx="4" fill="#f0883e"/>
    <text x="122" y="111" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="#1a0a00">S</text>
    <rect x="14" y="98" width="42" height="18" rx="4" fill="#3fb950"/>
    <text x="35" y="112" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="#001a05">B</text>
    <rect x="188" y="98" width="42" height="18" rx="4" fill="#c8a14b"/>
    <text x="209" y="112" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="#1a1200">A</text>
    <circle cx="35" cy="58" r="16" fill="none" stroke="#8b949e" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="122" cy="46" r="20" fill="none" stroke="#c8a14b" stroke-opacity="0.8" stroke-width="2"/>
    <circle cx="209" cy="58" r="16" fill="none" stroke="#d2a8ff" stroke-opacity="0.6" stroke-width="2"/>
  </g>
  <text x="1132" y="232" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#8b949e" letter-spacing="2">PICK RATE · TIER</text>
</svg>
