# 每日预览版：构建 main 最新提交，只上传 Actions 构建产物，不发布 Release（与正式版分开）
name: nightly
on:
  schedule:
    - cron: "0 18 * * *" # 每天北京时间 02:00
  workflow_dispatch:
concurrency:
  group: nightly
  cancel-in-progress: true
jobs:
  nightly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 定时触发时，与上次成功的 nightly 是同一提交就跳过
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w nightly -s success -L 1 --json headSha -q '.[0].headSha' 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "name=hexpilot-nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}-win-x64-portable" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with: { version: 10 }
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.skip != 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - if: steps.check.outputs.skip != 'true'
        run: pnpm portable
        env:
          PACK_NAME: ${{ steps.check.outputs.name }}
      # 上传解压后的文件夹：GitHub 下载产物时会自动打包成 zip，避免 zip 套 zip
      - if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.check.outputs.name }}
          path: dist-portable/hexpilot/
          retention-days: 30
