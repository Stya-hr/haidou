# 每日预览版：构建 main 最新提交，替换固定标签 nightly 的预发布版本（不会成为 Latest）
name: nightly
on:
  schedule:
    - cron: "0 18 * * *" # 每天北京时间 02:00
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nightly
  cancel-in-progress: true
jobs:
  nightly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # 定时触发时，没有新提交就跳过
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release view nightly --json targetCommitish -q .targetCommitish 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "name=hexpilot-nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}-win-x64-portable" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with: { version: 10 }
      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.skip != 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - if: steps.check.outputs.skip != 'true'
        run: pnpm portable
        env:
          PACK_NAME: ${{ steps.check.outputs.name }}
      - if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          {
            echo "⚠️ 每日预览版，自动构建自 \`main\` 的最新提交 \`${GITHUB_SHA::7}\`，未经实测，可能不稳定。正式版见 [Releases](https://github.com/${GITHUB_REPOSITORY}/releases/latest)。"
            echo
            echo "⚠️ Nightly preview built from \`main\` at \`${GITHUB_SHA::7}\`. Untested and may be unstable. Stable builds: [latest release](https://github.com/${GITHUB_REPOSITORY}/releases/latest)."
            echo
            if [ -n "$stable" ]; then
              echo "### ${stable} 之后的改动 · Changes since ${stable}"
              echo
              git log --no-merges --format='- %s (%h)' "${stable}..HEAD"
            fi
          } > nightly-notes.md
          gh release delete nightly --cleanup-tag -y 2>/dev/null || true
          gh release create nightly "dist-portable/${{ steps.check.outputs.name }}.zip" \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" --notes-file nightly-notes.md
