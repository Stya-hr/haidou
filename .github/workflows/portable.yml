# 在 Windows 上构建 zip 便携版（手动触发或推送 v* 标签）
name: portable
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - id: pack
        run: pnpm portable
      # Artifact 下载时 GitHub 会自动再打一层 zip，所以这里上传解压后的文件夹，
      # 避免出现 zip 套 zip；Release 里附的才是我们自己打的 zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: dist-portable/hexpilot/
      # 推送 v* 标签时自动发布 Release，说明取自 CHANGELOG.md 中对应版本的段落
      - if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.mjs ${{ github.ref_name }} > release-notes.md
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-portable/*.zip
          body_path: release-notes.md
